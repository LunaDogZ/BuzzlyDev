<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>แฟ้มเจ็ดตัวชี้วัด Buzzly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap">
</head>
<body>
<style>
:root{
  --paper:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --surface-3:#E8EDF1;
  --ink:#111B26; --ink-2:#3D4E5E; --ink-3:#6B7C8B;
  --line:#CFD9E1; --line-2:#E2E9EE;
  --accent:#16528C; --accent-soft:#E2EDF7;
  --pass:#1B6B4C; --pass-soft:#E0F0E8;
  --fail:#A32A22; --fail-soft:#F8E6E3;
  --prov:#8A5A10; --prov-soft:#F7EEDC;
  --shadow:0 1px 2px rgba(17,27,38,.05), 0 8px 24px -16px rgba(17,27,38,.28);
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans:"IBM Plex Sans Thai", "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D141A; --surface:#151E26; --surface-2:#1B252E; --surface-3:#222E38;
    --ink:#E7EDF3; --ink-2:#B4C1CC; --ink-3:#8598A6;
    --line:#2B3843; --line-2:#212C35;
    --accent:#72ACE8; --accent-soft:#152A3E;
    --pass:#5CC69B; --pass-soft:#0F2B23;
    --fail:#F2917F; --fail-soft:#2F1715;
    --prov:#E0AC4D; --prov-soft:#2D2311;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#0D141A; --surface:#151E26; --surface-2:#1B252E; --surface-3:#222E38;
  --ink:#E7EDF3; --ink-2:#B4C1CC; --ink-3:#8598A6;
  --line:#2B3843; --line-2:#212C35;
  --accent:#72ACE8; --accent-soft:#152A3E;
  --pass:#5CC69B; --pass-soft:#0F2B23;
  --fail:#F2917F; --fail-soft:#2F1715;
  --prov:#E0AC4D; --prov-soft:#2D2311;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:74px}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} *{animation:none !important; transition:none !important} }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1140px; margin:0 auto; padding-inline:20px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

/* ---------- typography ---------- */
h1,h2,h3,h4{margin:0; text-wrap:balance; letter-spacing:-.012em; line-height:1.24}
h1{font-size:clamp(28px,4.4vw,44px); font-weight:700; letter-spacing:-.028em}
h2{font-size:clamp(21px,2.6vw,28px); font-weight:600}
h3{font-size:18px; font-weight:600}
h4{font-size:15px; font-weight:600}
p{margin:0}
.eyebrow{
  font-family:var(--mono); font-size:11px; font-weight:500; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-3);
}
.lede{font-size:17px; line-height:1.66; color:var(--ink-2); max-width:66ch}
.small{font-size:13px; line-height:1.6; color:var(--ink-2)}
.tiny{font-size:12px; line-height:1.55; color:var(--ink-3)}
.num{font-family:var(--mono); font-variant-numeric:tabular-nums}
code{font-family:var(--mono); font-size:.88em; background:var(--surface-3); padding:.12em .36em; border-radius:3px; color:var(--ink-2)}
strong{font-weight:600}

/* ---------- masthead ---------- */
.mast{border-bottom:1px solid var(--line); background:var(--surface)}
.mast-in{padding-block:44px 34px; display:grid; gap:22px}
.mast-rule{display:flex; align-items:center; gap:14px; flex-wrap:wrap}
.mast-rule .bar{flex:1 1 60px; height:1px; background:var(--line); min-width:24px}
.tally{display:flex; flex-wrap:wrap; gap:8px}
.tally-item{
  display:flex; align-items:baseline; gap:7px; padding:7px 13px; border-radius:2px;
  border:1px solid var(--line); background:var(--surface-2);
}
.tally-item .n{font-family:var(--mono); font-size:19px; font-weight:600; font-variant-numeric:tabular-nums}
.tally-item .l{font-size:12.5px; color:var(--ink-2)}
.tally-item.pass{border-color:var(--pass); background:var(--pass-soft)} .tally-item.pass .n{color:var(--pass)}
.tally-item.fail{border-color:var(--fail); background:var(--fail-soft)} .tally-item.fail .n{color:var(--fail)}
.tally-item.prov{border-color:var(--prov); background:var(--prov-soft)} .tally-item.prov .n{color:var(--prov)}

/* ---------- sticky nav ---------- */
.nav{
  position:sticky; top:0; z-index:40; background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
}
.nav-in{display:flex; gap:6px; overflow-x:auto; padding-block:9px; scrollbar-width:thin}
.nav-chip{
  flex:0 0 auto; font-family:var(--mono); font-size:11.5px; font-weight:500; letter-spacing:.04em;
  padding:5px 10px; border-radius:2px; border:1px solid transparent; color:var(--ink-3);
  text-decoration:none; white-space:nowrap; display:flex; align-items:center; gap:6px;
}
.nav-chip:hover{background:var(--surface-3); color:var(--ink)}
.dot{width:6px; height:6px; border-radius:50%; flex:0 0 auto}
.dot.pass{background:var(--pass)} .dot.fail{background:var(--fail)} .dot.prov{background:var(--prov)}

/* ---------- scoreboard ---------- */
.board{display:grid; grid-template-columns:repeat(auto-fit,minmax(248px,1fr)); gap:1px; background:var(--line-2); border:1px solid var(--line-2)}
.tile{
  background:var(--surface); padding:16px 17px 15px; display:grid; gap:11px; align-content:start;
  text-decoration:none; color:inherit; position:relative; border-left:3px solid transparent;
}
.tile:hover{background:var(--surface-2)}
.tile.pass{border-left-color:var(--pass)} .tile.fail{border-left-color:var(--fail)} .tile.prov{border-left-color:var(--prov)}
.tile-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.tile-name{font-size:14.5px; font-weight:600; line-height:1.35}
.tile-sub{font-size:12.5px; color:var(--ink-3); line-height:1.45}
.chip{
  font-family:var(--mono); font-size:10.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase;
  padding:3px 7px; border-radius:2px; white-space:nowrap;
}
.chip.pass{background:var(--pass-soft); color:var(--pass)}
.chip.fail{background:var(--fail-soft); color:var(--fail)}
.chip.prov{background:var(--prov-soft); color:var(--prov)}
.chip.neutral{background:var(--surface-3); color:var(--ink-2)}

/* ---------- threshold bar (the recurring motif) ---------- */
.tb{display:grid; gap:5px}
.tb-track{position:relative; height:24px; background:var(--surface-3); border-radius:2px; overflow:hidden}
.tb-fill{position:absolute; inset-block:0; left:0; border-radius:2px}
.tb-fill.pass{background:var(--pass); opacity:.78}
.tb-fill.fail{background:var(--fail); opacity:.78}
.tb-fill.prov{background:var(--prov); opacity:.78}
.tb-mark{position:absolute; inset-block:-2px; width:0; border-left:2px dashed var(--ink); opacity:.72}
.tb-legend{display:flex; justify-content:space-between; gap:12px; font-family:var(--mono); font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.tb-legend b{color:var(--ink); font-weight:600}

/* ---------- dossier ---------- */
.dossier{border-top:2px solid var(--ink); padding-block:44px 48px; scroll-margin-top:74px}
.dossier-head{display:grid; gap:14px; margin-bottom:26px}
.dossier-id{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.dossier-id .kid{font-family:var(--mono); font-size:13px; font-weight:600; letter-spacing:.1em; color:var(--ink)}
.dossier-id .grp{font-size:12.5px; color:var(--ink-3)}
.spec{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1px;
  background:var(--line-2); border:1px solid var(--line-2); margin-bottom:26px;
}
.spec-cell{background:var(--surface); padding:12px 14px; display:grid; gap:3px; align-content:start}
.spec-cell .k{font-family:var(--mono); font-size:10.5px; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}
.spec-cell .v{font-size:13.5px; line-height:1.5; color:var(--ink)}
.spec-cell .v .num{font-size:14px}

.block{display:grid; gap:10px; margin-bottom:26px}
.block > h4{display:flex; align-items:center; gap:9px}
.block > h4::before{content:""; width:14px; height:2px; background:var(--accent); flex:0 0 auto}
.block p{max-width:72ch}

.formula{
  font-family:var(--mono); font-size:13px; line-height:1.85; background:var(--surface-2);
  border:1px solid var(--line-2); border-left:3px solid var(--accent); padding:14px 16px;
  overflow-x:auto; white-space:pre; color:var(--ink); font-variant-numeric:tabular-nums;
}
.note{
  border-left:3px solid var(--line); padding:2px 0 2px 14px; color:var(--ink-2); font-size:13.5px; max-width:70ch;
}
.note.warn{border-left-color:var(--prov)}
.note.bad{border-left-color:var(--fail)}
.note.good{border-left-color:var(--pass)}
.note.key{border-left-color:var(--accent); background:var(--accent-soft); padding:12px 14px; border-radius:0 2px 2px 0; color:var(--ink)}

/* ---------- tables ---------- */
.tw{overflow-x:auto; border:1px solid var(--line-2); background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:13px; min-width:420px}
th,td{padding:8px 12px; text-align:left; border-bottom:1px solid var(--line-2); vertical-align:top}
thead th{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--ink-3); font-weight:500; background:var(--surface-2); white-space:nowrap;
}
tbody tr:last-child td{border-bottom:none}
td.n, th.n{text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap}
tbody tr.hi td{background:var(--accent-soft)}
td .ok{color:var(--pass); font-weight:600}
td .no{color:var(--fail); font-weight:600}

/* ---------- charts ---------- */
.chart{background:var(--surface); border:1px solid var(--line-2); padding:16px 16px 12px; display:grid; gap:10px}
.chart svg{display:block; width:100%; height:auto; max-width:100%}
.legend{display:flex; flex-wrap:wrap; gap:14px; font-family:var(--mono); font-size:11px; color:var(--ink-3)}
.legend span{display:flex; align-items:center; gap:6px}
.swatch{width:11px; height:11px; border-radius:2px; flex:0 0 auto}

/* ---------- remedy cards ---------- */
.remedies{display:grid; gap:1px; background:var(--line-2); border:1px solid var(--line-2)}
.remedy{background:var(--surface); padding:16px 18px; display:grid; gap:9px}
.remedy-top{display:flex; align-items:baseline; gap:11px; flex-wrap:wrap}
.remedy-letter{
  font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.06em;
  background:var(--ink); color:var(--paper); padding:2px 8px; border-radius:2px;
}
.remedy.pick .remedy-letter{background:var(--accent); color:#fff}
.remedy-meta{display:flex; flex-wrap:wrap; gap:7px}
.mchip{font-family:var(--mono); font-size:10.5px; letter-spacing:.06em; padding:2px 7px; border:1px solid var(--line); border-radius:2px; color:var(--ink-2); background:var(--surface-2)}

/* ---------- budget ---------- */
.calc{display:grid; grid-template-columns:minmax(240px,1fr) minmax(260px,1.1fr); gap:1px; background:var(--line-2); border:1px solid var(--line-2)}
@media (max-width:720px){ .calc{grid-template-columns:1fr} }
.calc-side{background:var(--surface); padding:18px}
.opt{display:grid; gap:7px; margin-top:12px}
.opt label{
  display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border:1px solid var(--line);
  border-radius:2px; cursor:pointer; background:var(--surface-2);
}
.opt label:hover{border-color:var(--accent)}
.opt label.on{border-color:var(--accent); background:var(--accent-soft)}
.opt input{margin-top:4px; accent-color:var(--accent)}
.opt .t{font-size:13.5px; font-weight:600}
.opt .d{font-size:12px; color:var(--ink-3); line-height:1.45}
.readout{display:grid; gap:12px; align-content:start}
.readout .big{font-family:var(--mono); font-size:clamp(30px,6vw,44px); font-weight:600; line-height:1; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.readout .sub{font-family:var(--mono); font-size:14px; color:var(--ink-2); font-variant-numeric:tabular-nums}
.breakdown{display:grid; gap:5px; font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums}
.breakdown .row{display:flex; justify-content:space-between; gap:12px; padding-bottom:5px; border-bottom:1px dotted var(--line)}
.breakdown .row.tot{border-bottom:none; border-top:1px solid var(--line); padding-top:7px; font-weight:600; color:var(--ink)}

/* ---------- misc ---------- */
.section{padding-block:44px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:18px}
.card{background:var(--surface); border:1px solid var(--line-2); padding:16px 18px; display:grid; gap:9px; align-content:start}
.card.accent{border-left:3px solid var(--accent)}
.pathlist{display:grid; gap:4px; font-family:var(--mono); font-size:12px; color:var(--ink-2); word-break:break-all}
footer{border-top:1px solid var(--line); padding-block:30px 44px; color:var(--ink-3)}
hr.soft{border:none; border-top:1px solid var(--line-2); margin:0}
ul.plain{margin:0; padding-left:1.15em; display:grid; gap:6px; max-width:72ch}
ul.plain li{padding-left:2px}
ol.plain{margin:0; padding-left:1.35em; display:grid; gap:7px; max-width:72ch}
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const {useState, useMemo} = React;

/* ═══════════════ ข้อมูล — ทุกตัวเลขมาจากไฟล์ใน repo ═══════════════ */

const FX = 33.234437;          // USD→THB, open.er-api.com, 2026-09-15
const baht = (usd) => Math.round(usd * FX).toLocaleString("en-US");

const SUS_RAW = {
  P01:[3,4,5,1,5,1,4,1,3,5], P02:[4,4,3,4,4,3,3,3,3,4], P03:[5,1,5,2,4,2,4,2,4,1],
  P04:[4,3,3,4,4,4,3,3,4,4], P05:[4,2,3,4,5,2,5,1,4,4], P06:[3,1,3,2,5,1,3,1,5,1],
  P07:[4,3,5,4,5,2,4,3,5,3], P08:[4,3,4,3,5,2,5,1,4,5], P09:[3,2,4,3,4,1,4,1,3,3],
  P10:[3,3,3,4,5,1,4,2,5,3], P11:[3,2,5,1,5,1,4,2,4,1],
};
const susScore = (v) => 2.5 * v.reduce((s,r,i) => s + (i % 2 === 0 ? r - 1 : 5 - r), 0);

/* ═══════════════ ชิ้นส่วน UI ═══════════════ */

function Chip({kind, children}) {
  return <span className={"chip " + kind}>{children}</span>;
}

/* แถบเกณฑ์ — เส้นประคือเกณฑ์ที่ pre-register ไว้, แท่งคือค่าที่วัดได้ */
function ThresholdBar({value, threshold, max, dir, fmt, verdict, clipped}) {
  const pct = (x) => Math.max(0, Math.min(100, (x / max) * 100));
  return (
    <div className="tb">
      <div className="tb-track">
        <div className={"tb-fill " + verdict} style={{width: pct(value) + "%"}} />
        <div className="tb-mark" style={{left: pct(threshold) + "%"}} />
      </div>
      <div className="tb-legend">
        <span>วัดได้ <b>{fmt(value)}{clipped ? " ⟵ ชนเพดาน" : ""}</b></span>
        <span>เกณฑ์ {dir} <b>{fmt(threshold)}</b></span>
      </div>
    </div>
  );
}

function Spec({rows}) {
  return (
    <div className="spec">
      {rows.map(([k, v]) => (
        <div className="spec-cell" key={k}>
          <div className="k">{k}</div>
          <div className="v">{v}</div>
        </div>
      ))}
    </div>
  );
}

function Block({title, children}) {
  return <div className="block"><h4>{title}</h4>{children}</div>;
}

function Table({head, rows, align}) {
  return (
    <div className="tw">
      <table>
        <thead><tr>{head.map((h,i) => <th key={i} className={align && align[i] === "n" ? "n" : ""}>{h}</th>)}</tr></thead>
        <tbody>
          {rows.map((r,i) => (
            <tr key={i} className={r.hi ? "hi" : ""}>
              {(r.cells || r).map((c,j) => <td key={j} className={align && align[j] === "n" ? "n" : ""}>{c}</td>)}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

/* ── กราฟ Lighthouse: 3 เส้นทาง × 2 รอบ เทียบเส้น 80 ── */
function LighthouseChart() {
  const W = 680, H = 250, PADL = 44, PADR = 16, PADT = 16, PADB = 52;
  const plotW = W - PADL - PADR, plotH = H - PADT - PADB;
  const routes = [
    {label: "R1  /", r1: 100, r2: 100},
    {label: "R2  /dashboard", r1: 65, r2: 68},
    {label: "R3  /imports", r1: 74, r2: 70},
  ];
  const y = (v) => PADT + plotH - (v / 100) * plotH;
  const groupW = plotW / routes.length;
  const barW = 40, gap = 14;

  return (
    <div className="chart">
      <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label="คะแนน Lighthouse desktop สามเส้นทาง สองรอบ เทียบเกณฑ์ 80">
        {[0,20,40,60,80,100].map(v => (
          <g key={v}>
            <line x1={PADL} x2={W-PADR} y1={y(v)} y2={y(v)}
                  stroke="var(--line-2)" strokeWidth="1" />
            <text x={PADL-8} y={y(v)+4} textAnchor="end"
                  fontFamily="var(--mono)" fontSize="11" fill="var(--ink-3)">{v}</text>
          </g>
        ))}
        <line x1={PADL} x2={W-PADR} y1={y(80)} y2={y(80)} stroke="var(--ink)" strokeWidth="1.5" strokeDasharray="6 4" opacity="0.8" />
        <text x={W-PADR} y={y(80)-7} textAnchor="end" fontFamily="var(--mono)" fontSize="11" fontWeight="600" fill="var(--ink)">เกณฑ์ ≥ 80</text>

        {routes.map((r, i) => {
          const cx = PADL + groupW * i + groupW / 2;
          const x1 = cx - barW - gap/2, x2 = cx + gap/2;
          const col1 = r.r1 >= 80 ? "var(--pass)" : "var(--fail)";
          const col2 = r.r2 >= 80 ? "var(--pass)" : "var(--fail)";
          return (
            <g key={r.label}>
              <rect x={x1} y={y(r.r1)} width={barW} height={PADT+plotH-y(r.r1)} fill={col1} opacity="0.4" />
              <rect x={x2} y={y(r.r2)} width={barW} height={PADT+plotH-y(r.r2)} fill={col2} opacity="0.92" />
              <text x={x1+barW/2} y={y(r.r1)-6} textAnchor="middle" fontFamily="var(--mono)" fontSize="11.5" fill="var(--ink-2)">{r.r1}</text>
              <text x={x2+barW/2} y={y(r.r2)-6} textAnchor="middle" fontFamily="var(--mono)" fontSize="11.5" fontWeight="600" fill="var(--ink)">{r.r2}</text>
              <text x={cx} y={PADT+plotH+20} textAnchor="middle" fontFamily="var(--mono)" fontSize="11.5" fill="var(--ink-2)">{r.label}</text>
            </g>
          );
        })}
        <line x1={PADL} x2={W-PADR} y1={PADT+plotH} y2={PADT+plotH} stroke="var(--line)" strokeWidth="1" />
      </svg>
      <div className="legend">
        <span><i className="swatch" style={{background:"var(--fail)", opacity:.4}} /> รอบ 1 · 4c13722 · 7 ก.ย.</span>
        <span><i className="swatch" style={{background:"var(--fail)"}} /> รอบ 2 · 29a88bb · 8 ก.ย. (หลังปรับ)</span>
      </div>
    </div>
  );
}

/* ── กราฟ p95 ต่อ step: ทุก step ที่แตะฐานข้อมูลชนเพดาน 60 วิ ── */
function StepChart() {
  const W = 680, H = 300, PADL = 210, PADR = 56, PADT = 14, PADB = 40;
  const plotW = W - PADL - PADR, plotH = H - PADT - PADB;
  const steps = [
    {l: "1 · SPA shell (CDN, ไม่แตะ DB)", v: 0.51, db: false},
    {l: "2 · login", v: 45.68, db: true},
    {l: "3 · session bootstrap", v: 60, db: true},
    {l: "4 · ad accounts", v: 60, db: true},
    {l: "5 · insights ช่วงกว้าง", v: 60, db: true},
    {l: "6 · นับต่อแหล่งข้อมูล", v: 60, db: true},
    {l: "7 · insights เปลี่ยนช่วง", v: 60, db: true},
  ];
  const max = 62;
  const x = (v) => PADL + (v / max) * plotW;
  const rowH = plotH / steps.length;
  const bh = 17;
  return (
    <div className="chart">
      <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label="p95 ต่อขั้นตอน เทียบเกณฑ์ 2 วินาที">
        {[0,10,20,30,40,50,60].map(v => (
          <g key={v}>
            <line x1={x(v)} x2={x(v)} y1={PADT} y2={PADT+plotH} stroke="var(--line-2)" strokeWidth="1" />
            <text x={x(v)} y={PADT+plotH+20} textAnchor="middle" fontFamily="var(--mono)" fontSize="11" fill="var(--ink-3)">{v}s</text>
          </g>
        ))}
        <line x1={x(2)} x2={x(2)} y1={PADT-4} y2={PADT+plotH+4} stroke="var(--ink)" strokeWidth="1.5" strokeDasharray="5 4" opacity="0.85" />
        <text x={x(2)} y={PADT-6} textAnchor="middle" fontFamily="var(--mono)" fontSize="11" fontWeight="600" fill="var(--ink)">2s</text>

        {steps.map((s, i) => {
          const cy = PADT + rowH * i + rowH/2;
          return (
            <g key={s.l}>
              <text x={PADL-10} y={cy+4} textAnchor="end" fontFamily="var(--mono)" fontSize="11" fill={s.db ? "var(--ink-2)" : "var(--pass)"}>{s.l}</text>
              <rect x={PADL} y={cy-bh/2} width={Math.max(2, x(s.v)-PADL)} height={bh}
                    fill={s.db ? "var(--fail)" : "var(--pass)"} opacity={s.db ? 0.85 : 0.9} />
              <text x={x(s.v)+7} y={cy+4} fontFamily="var(--mono)" fontSize="11" fontWeight="600"
                    fill={s.db ? "var(--fail)" : "var(--pass)"}>{s.v === 60 ? "60.0" : s.v.toFixed(2)}</text>
            </g>
          );
        })}
      </svg>
      <div className="legend">
        <span><i className="swatch" style={{background:"var(--pass)"}} /> ไม่แตะฐานข้อมูล</span>
        <span><i className="swatch" style={{background:"var(--fail)"}} /> แตะฐานข้อมูล</span>
        <span>ค่าจาก run 3 รอบ 2 · 60.0 วิ = timeout ของ k6 คือ p95 ไม่เสร็จเลย</span>
      </div>
    </div>
  );
}

/* ── SUS dot plot ── */
function SusPlot({scores, mean, ci}) {
  const W = 680, H = 168, PADL = 26, PADR = 26, PADT = 46, PADB = 44;
  const plotW = W - PADL - PADR;
  const x = (v) => PADL + (v / 100) * plotW;
  const axisY = PADT + 40;
  const counts = {};
  return (
    <div className="chart">
      <svg viewBox={`0 0 ${W} ${H}`} role="img" aria-label="คะแนน SUS รายคน 11 คน เทียบเกณฑ์ 68">
        <rect x={x(ci[0])} y={PADT-24} width={x(ci[1])-x(ci[0])} height={70} fill="var(--accent)" opacity="0.13" />
        <text x={x(ci[0])} y={PADT-30} fontFamily="var(--mono)" fontSize="10.5" fill="var(--accent)">95% CI {ci[0].toFixed(1)}</text>
        <text x={x(ci[1])} y={PADT-30} textAnchor="end" fontFamily="var(--mono)" fontSize="10.5" fill="var(--accent)">{ci[1].toFixed(1)}</text>

        <line x1={PADL} x2={W-PADR} y1={axisY} y2={axisY} stroke="var(--line)" strokeWidth="1" />
        {[0,20,40,60,80,100].map(v => (
          <g key={v}>
            <line x1={x(v)} x2={x(v)} y1={axisY} y2={axisY+5} stroke="var(--line)" strokeWidth="1" />
            <text x={x(v)} y={axisY+20} textAnchor="middle" fontFamily="var(--mono)" fontSize="11" fill="var(--ink-3)">{v}</text>
          </g>
        ))}
        <line x1={x(68)} x2={x(68)} y1={PADT-24} y2={axisY+8} stroke="var(--ink)" strokeWidth="1.5" strokeDasharray="5 4" opacity="0.85" />
        <text x={x(68)} y={H-10} textAnchor="middle" fontFamily="var(--mono)" fontSize="11" fontWeight="600" fill="var(--ink)">เกณฑ์ 68</text>

        {scores.map(([pid, s], i) => {
          counts[s] = (counts[s] || 0) + 1;
          const stack = counts[s] - 1;
          return (
            <circle key={pid} cx={x(s)} cy={axisY - 11 - stack * 13} r="5.5"
                    fill={s >= 68 ? "var(--pass)" : "var(--fail)"} opacity="0.85"
                    stroke="var(--surface)" strokeWidth="1.2">
              <title>{pid}: {s}</title>
            </circle>
          );
        })}
        <polygon points={`${x(mean)},${axisY+7} ${x(mean)-6},${axisY+18} ${x(mean)+6},${axisY+18}`} fill="var(--accent)" />
        <text x={x(mean)} y={H-10} textAnchor="middle" fontFamily="var(--mono)" fontSize="11" fontWeight="600" fill="var(--accent)">ค่าเฉลี่ย {mean.toFixed(1)}</text>
      </svg>
      <div className="legend">
        <span><i className="swatch" style={{background:"var(--pass)", borderRadius:"50%"}} /> ≥ 68</span>
        <span><i className="swatch" style={{background:"var(--fail)", borderRadius:"50%"}} /> &lt; 68</span>
        <span>หนึ่งจุด = ผู้เข้าร่วมหนึ่งคน · จุดซ้อนกันคือคะแนนเท่ากัน</span>
      </div>
    </div>
  );
}
