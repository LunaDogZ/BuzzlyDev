<title>ผลวัดเจ็ดตัวชี้วัด Buzzly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  /* ── tokens ─────────────────────────────────────────────────────────────
     Light palette complete on bare :root; dark redefines only tokens, under
     both the OS media query and the explicit theme stamp. Series colours are
     the validated categorical slots 1 (blue) and 2 (orange); status colours
     are the reserved status palette and are never used as a series. */
  :root {
    color-scheme: light;
    --ground:        #f7f7f5;
    --surface:       #fcfcfb;
    --surface-sunk:  #f1f1ee;
    --rule:          #e0e0da;
    --rule-strong:   #c8c8c0;
    --ink:           #14140f;
    --ink-2:         #52514e;
    --ink-3:         #7b7a74;
    --accent:        #1c5cab;
    --series-before: #2a78d6;
    --series-after:  #eb6834;
    --good:          #0ca30c;
    --warning:       #fab219;
    --critical:      #d03b3b;
    --good-wash:     #eaf6ea;
    --critical-wash: #fbeaea;
    --warning-wash:  #fdf3e0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground:        #141413;
      --surface:       #1a1a19;
      --surface-sunk:  #212120;
      --rule:          #33332f;
      --rule-strong:   #4a4a45;
      --ink:           #f6f6f1;
      --ink-2:         #c3c2b7;
      --ink-3:         #918f86;
      --accent:        #86b6ef;
      --series-before: #3987e5;
      --series-after:  #d95926;
      --good:          #0ca30c;
      --warning:       #fab219;
      --critical:      #d03b3b;
      --good-wash:     #16251656;
      --critical-wash: #2a151556;
      --warning-wash:  #2a221056;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground:        #141413;
    --surface:       #1a1a19;
    --surface-sunk:  #212120;
    --rule:          #33332f;
    --rule-strong:   #4a4a45;
    --ink:           #f6f6f1;
    --ink-2:         #c3c2b7;
    --ink-3:         #918f86;
    --accent:        #86b6ef;
    --series-before: #3987e5;
    --series-after:  #d95926;
    --good:          #0ca30c;
    --warning:       #fab219;
    --critical:      #d03b3b;
    --good-wash:     #16251656;
    --critical-wash: #2a151556;
    --warning-wash:  #2a221056;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.72;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: "IBM Plex Mono", ui-monospace, Menlo, monospace; }

  /* ── page frame: a document column with a citation rail ─────────────── */
  .page { max-width: 1120px; margin: 0 auto; padding: 0 24px 96px; }
  .band { border-bottom: 1px solid var(--rule); }
  .row {
    display: grid;
    grid-template-columns: 172px minmax(0, 1fr);
    gap: 40px;
    padding: 44px 0;
  }
  .rail {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--ink-3);
    border-left: 2px solid var(--rule-strong);
    padding-left: 14px;
    word-break: break-word;
  }
  .rail b { display: block; color: var(--ink-2); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 10.5px; margin-bottom: 6px; }
  .rail p { margin: 0 0 8px; }
  @media (max-width: 820px) {
    .row { grid-template-columns: 1fr; gap: 18px; padding: 32px 0; }
    .rail { border-left: none; border-top: 2px solid var(--rule-strong); padding-left: 0; padding-top: 10px; order: 2; }
    .col { order: 1; }
  }

  h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.18; margin: 0 0 12px; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
  h2 { font-size: 24px; margin: 0 0 6px; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
  h3 { font-size: 16.5px; margin: 28px 0 8px; font-weight: 600; }
  p  { margin: 0 0 14px; max-width: 64ch; }
  .lede { font-size: 18px; color: var(--ink-2); max-width: 62ch; }
  .eyebrow {
    font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px;
  }
  a { color: var(--accent); }

  /* ── status chip: colour never alone — glyph + word ─────────────────── */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600;
    letter-spacing: .06em; padding: 3px 9px; border-radius: 3px; white-space: nowrap;
  }
  .chip.pass    { background: var(--good-wash);     color: var(--good);     border: 1px solid var(--good); }
  .chip.fail    { background: var(--critical-wash); color: var(--critical); border: 1px solid var(--critical); }
  .chip.pending { background: var(--warning-wash);  color: var(--ink-2);    border: 1px solid var(--warning); }

  /* ── scoreboard ─────────────────────────────────────────────────────── */
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
  .cell { background: var(--surface); padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 7px; }
  .cell .id { font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .06em; }
  .cell .what { font-size: 14px; color: var(--ink-2); line-height: 1.5; }
  .cell .fig { font-family: "IBM Plex Mono", monospace; font-size: 25px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .cell .bar { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-3); }

  /* ── tables ─────────────────────────────────────────────────────────── */
  .tablewrap { overflow-x: auto; margin: 18px 0 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 8px 14px 8px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
  td.num, th.num { text-align: right; font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; padding-right: 18px; }

  /* ── figure ─────────────────────────────────────────────────────────── */
  figure { margin: 26px 0 8px; }
  figcaption { font-size: 13px; color: var(--ink-3); margin-top: 10px; max-width: 68ch; }
  .figtitle { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .figsub { font-size: 13px; color: var(--ink-3); margin-bottom: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; font-size: 12.5px; color: var(--ink-2); align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
  .chartbox { position: relative; background: var(--surface); border: 1px solid var(--rule); padding: 14px 12px 6px; overflow-x: auto; }
  svg text { font-family: "IBM Plex Mono", ui-monospace, monospace; }

  .tip {
    position: absolute; pointer-events: none; z-index: 5;
    background: var(--ink); color: var(--ground);
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px; line-height: 1.5;
    padding: 6px 9px; border-radius: 4px; white-space: nowrap;
    transform: translate(-50%, -120%);
  }

  .note {
    border-left: 3px solid var(--rule-strong); padding: 2px 0 2px 16px;
    margin: 20px 0; color: var(--ink-2); font-size: 15px;
  }
  .note.warn { border-left-color: var(--warning); }
  .note b, p b, li b { font-weight: 600; color: var(--ink); }
  ul { margin: 0 0 14px; padding-left: 20px; max-width: 64ch; }
  li { margin-bottom: 7px; }
  code { font-family: "IBM Plex Mono", monospace; font-size: .88em; background: var(--surface-sunk); padding: 1px 5px; border-radius: 3px; }
  .foot { padding: 34px 0 0; color: var(--ink-3); font-size: 13px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
(function () {
  "use strict";
  var h = React.createElement;
  var useState = React.useState;

  // ─────────────────────────────────────────────────────────────────────────
  // DATA. Every figure below is transcribed from a file in the repository;
  // the `src` field on each block names it. Nothing here is estimated.
  // ─────────────────────────────────────────────────────────────────────────

  var KPIS = [
    { id: "KPI-1", group: "A", what: "ข้อมูลที่เก็บตรงกับ Meta Ads Manager",
      fig: "0.0000%", bar: "เกณฑ์ MAPE ≤ 0.5%", status: "pass" },
    { id: "KPI-2", group: "A", what: "ไฟล์ถูกต้องที่นำเข้าได้ครบตามที่ประกาศไว้",
      fig: "20/20", bar: "เกณฑ์ 100%", status: "pass" },
    { id: "KPI-3", group: "A", what: "ไฟล์เสียที่เข้า dead-letter ถูกรหัส ไม่มีข้อมูลรั่ว",
      fig: "12/12", bar: "เกณฑ์ 100% ทั้ง 3 แกน", status: "pass" },
    { id: "KPI-4", group: "B", what: "คะแนน Lighthouse Performance (desktop)",
      fig: "68 / 70", bar: "เกณฑ์ ≥ 80 — สองเส้นทางไม่ถึง", status: "fail" },
    { id: "KPI-5", group: "B", what: "เวลาตอบสนองที่ผู้ใช้ 50 คนพร้อมกัน",
      fig: "60.00 s", bar: "เกณฑ์ p(95) < 2 s", status: "fail" },
    { id: "KPI-6", group: "C", what: "System Usability Scale หลังทำงานจริง",
      fig: "—", bar: "เกณฑ์ ≥ 68 · เก็บ 11 ก.ย.", status: "pending" },
    { id: "KPI-7", group: "D", what: "OWASP Top 10 + สแกนอัตโนมัติ",
      fig: "4/4", bar: "0 High/Critical · 10/10 หมวด", status: "pass" }
  ];

  var STATUS_LABEL = { pass: "ผ่าน", fail: "ไม่ผ่าน", pending: "ยังไม่วัด" };
  var STATUS_GLYPH = { pass: "✓", fail: "✕", pending: "◷" };

  // KPI-4 · Lighthouse desktop, median of runs 2–6, before = 4c13722, after = 29a88bb
  var LH = [
    { route: "R1  /", before: 100, after: 100 },
    { route: "R2  /dashboard", before: 65, after: 68 },
    { route: "R3  /imports", before: 74, after: 70 }
  ];

  // KPI-4 · request counts on the median desktop run
  var REQS = [
    { label: "/dashboard · คำขอทั้งหมด", before: 147, after: 80 },
    { label: "/dashboard · เรียก Supabase", before: 126, after: 60 },
    { label: "/dashboard · เรียก /auth/v1/", before: 30, after: 3 },
    { label: "/imports · คำขอทั้งหมด", before: 109, after: 61 },
    { label: "/imports · เรียก Supabase", before: 95, after: 48 },
    { label: "/imports · เรียก /auth/v1/", before: 26, after: 3 }
  ];

  // KPI-5 · k6, 50 VU, three runs per round
  var K5_MEDIAN_LAT = [
    { run: "run 1", before: 21.63, after: 1.73 },
    { run: "run 2", before: 35.00, after: 0.68 },
    { run: "run 3", before: 6.14, after: 48.79 }
  ];

  // 2026-09-10 · local preview build, alternating pairs, same cloud project
  var TODAY_PAIRS = [
    { label: "คู่ที่ 1", before: 11459, after: 5418 },
    { label: "คู่ที่ 2", before: 8938, after: 5476 },
    { label: "คู่ที่ 3", before: 10969, after: 13460 }
  ];

  var TODAY_COUNTS = [
    { label: "ทอดที่ต้องรอกันบนเส้นทางวิกฤต", before: 3, after: 1, unit: "ทอด" },
    { label: "คำขอ /auth/v1/user ต่อการเปิดหน้า", before: 3, after: 0, unit: "คำขอ" },
    { label: "คำขอ Supabase ทั้งหมดของ /campaigns", before: 51, after: 41, unit: "คำขอ" }
  ];

  // ─────────────────────────────────────────────────────────────────────────
  // CHART PRIMITIVES — inline SVG, one scale per chart, hover on every mark.
  // ─────────────────────────────────────────────────────────────────────────

  function useTip() {
    var s = useState(null);
    return { tip: s[0], show: function (e, text) {
      var box = e.currentTarget.ownerSVGElement.parentNode.getBoundingClientRect();
      var r = e.currentTarget.getBoundingClientRect();
      s[1]({ text: text, x: r.left - box.left + r.width / 2, y: r.top - box.top });
    }, hide: function () { s[1](null); } };
  }

  function Tip(props) {
    if (!props.tip) return null;
    return h("div", { className: "tip", style: { left: props.tip.x + "px", top: props.tip.y + "px" } }, props.tip.text);
  }

  function Legend(props) {
    return h("div", { className: "legend" },
      h("span", null, h("i", { className: "swatch", style: { background: "var(--series-before)" } }), props.before),
      h("span", null, h("i", { className: "swatch", style: { background: "var(--series-after)" } }), props.after),
      props.extra || null
    );
  }

  /* Grouped bars, two series, with a threshold rule drawn on the same scale. */
  function GroupedBars(props) {
    var t = useTip();
    var rows = props.rows, max = props.max, threshold = props.threshold;
    var W = 660, padL = 132, padR = 62, padT = 18, rowH = 62;
    var H = padT + rows.length * rowH + 30;
    var plotW = W - padL - padR;
    var x = function (v) { return padL + (v / max) * plotW; };

    var marks = [];
    rows.forEach(function (r, i) {
      var yTop = padT + i * rowH;
      [["before", r.before, "var(--series-before)"], ["after", r.after, "var(--series-after)"]].forEach(function (pair, k) {
        var val = pair[1];
        var w = Math.max(x(val) - padL, 1.5);
        var y = yTop + (k === 0 ? 8 : 30);
        marks.push(h("rect", {
          key: r.route + pair[0], x: padL, y: y, width: w, height: 16, rx: 4, ry: 4,
          fill: pair[2], stroke: "var(--surface)", strokeWidth: 2,
          onMouseEnter: function (e) { t.show(e, (k === 0 ? props.beforeName : props.afterName) + " · " + val + (props.unit || "")); },
          onMouseLeave: t.hide
        }));
        // Values sit in a fixed column at the right edge, never beside the bar
        // end — a label beside a 74-long bar lands on top of the 80 threshold
        // rule and both become unreadable.
        marks.push(h("text", {
          key: r.route + pair[0] + "l", x: W - padR + 12, y: y + 12.5,
          fontSize: 12.5, fontWeight: 600, fill: "var(--ink-2)"
        }, val));
      });
      marks.push(h("text", { key: r.route + "n", x: padL - 12, y: yTop + 30, fontSize: 12, textAnchor: "end", fill: "var(--ink-2)" }, r.route));
    });

    return h("div", { className: "chartbox" },
      h("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", role: "img", "aria-label": props.aria },
        threshold ? h("g", null,
          h("line", { x1: x(threshold), y1: padT - 4, x2: x(threshold), y2: H - 30, stroke: "var(--critical)", strokeWidth: 2, strokeDasharray: "5 4" }),
          h("text", { x: x(threshold), y: H - 14, fontSize: 11.5, textAnchor: "middle", fill: "var(--critical)", fontWeight: 600 }, props.thresholdLabel)
        ) : null,
        h("line", { x1: padL, y1: padT - 4, x2: padL, y2: H - 30, stroke: "var(--rule-strong)", strokeWidth: 1 }),
        marks
      ),
      h(Tip, { tip: t.tip })
    );
  }

  /* Dumbbell: before dot → after dot on one shared scale. Reads as change. */
  function Dumbbell(props) {
    var t = useTip();
    var rows = props.rows;
    var max = Math.max.apply(null, rows.map(function (r) { return Math.max(r.before, r.after); })) * 1.16;
    var W = 660, padL = 250, padR = 60, padT = 14, rowH = 34;
    var H = padT + rows.length * rowH + 8;
    var x = function (v) { return padL + (v / max) * (W - padL - padR); };

    var marks = [];
    rows.forEach(function (r, i) {
      var y = padT + i * rowH + 14;
      marks.push(h("line", { key: r.label + "c", x1: x(r.before), y1: y, x2: x(r.after), y2: y, stroke: "var(--rule-strong)", strokeWidth: 2 }));
      marks.push(h("circle", {
        key: r.label + "b", cx: x(r.before), cy: y, r: 6, fill: "var(--series-before)", stroke: "var(--surface)", strokeWidth: 2,
        onMouseEnter: function (e) { t.show(e, "ก่อน · " + r.before.toLocaleString() + " " + (r.unit || props.unit || "")); }, onMouseLeave: t.hide
      }));
      marks.push(h("circle", {
        key: r.label + "a", cx: x(r.after), cy: y, r: 6, fill: "var(--series-after)", stroke: "var(--surface)", strokeWidth: 2,
        onMouseEnter: function (e) { t.show(e, "หลัง · " + r.after.toLocaleString() + " " + (r.unit || props.unit || "")); }, onMouseLeave: t.hide
      }));
      marks.push(h("text", { key: r.label + "n", x: padL - 14, y: y + 4.5, fontSize: 12, textAnchor: "end", fill: "var(--ink-2)" }, r.label));
      marks.push(h("text", {
        key: r.label + "v", x: Math.max(x(r.after), x(r.before)) + 12, y: y + 4.5, fontSize: 12, fontWeight: 600,
        fill: "var(--ink-2)"
      }, r.before.toLocaleString() + " → " + r.after.toLocaleString()));
    });

    return h("div", { className: "chartbox" },
      h("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", role: "img", "aria-label": props.aria }, marks),
      h(Tip, { tip: t.tip })
    );
  }

  /* Vertical paired columns — used where the pairs are runs, not categories. */
  function PairedColumns(props) {
    var t = useTip();
    var rows = props.rows, unit = props.unit || "";
    var max = Math.max.apply(null, rows.map(function (r) { return Math.max(r.before, r.after); })) * 1.2;
    var W = 660, padL = 54, padR = 16, padB = 44, padT = 16, H = 260;
    var band = (W - padL - padR) / rows.length;
    var y = function (v) { return H - padB - (v / max) * (H - padB - padT); };

    var marks = [];
    [0.25, 0.5, 0.75, 1].forEach(function (f) {
      marks.push(h("line", { key: "g" + f, x1: padL, y1: y(max * f), x2: W - padR, y2: y(max * f), stroke: "var(--rule)", strokeWidth: 1 }));
      marks.push(h("text", { key: "gt" + f, x: padL - 10, y: y(max * f) + 4, fontSize: 11, textAnchor: "end", fill: "var(--ink-3)" },
        props.fmtAxis ? props.fmtAxis(max * f) : Math.round(max * f)));
    });
    rows.forEach(function (r, i) {
      var cx = padL + band * i + band / 2;
      [["ก่อน", r.before, "var(--series-before)", -1], ["หลัง", r.after, "var(--series-after)", 1]].forEach(function (p) {
        var bw = Math.min(46, band / 2 - 8);
        var bx = cx + (p[3] === -1 ? -bw - 2 : 2);
        marks.push(h("rect", {
          key: r.label + p[0], x: bx, y: y(p[1]), width: bw, height: Math.max(H - padB - y(p[1]), 2), rx: 4, ry: 4,
          fill: p[2], stroke: "var(--surface)", strokeWidth: 2,
          onMouseEnter: function (e) { t.show(e, p[0] + " · " + (props.fmtTip ? props.fmtTip(p[1]) : p[1] + unit)); }, onMouseLeave: t.hide
        }));
        marks.push(h("text", { key: r.label + p[0] + "v", x: bx + bw / 2, y: y(p[1]) - 7, fontSize: 11.5, fontWeight: 600, textAnchor: "middle", fill: "var(--ink-2)" },
          props.fmtLabel ? props.fmtLabel(p[1]) : p[1]));
      });
      marks.push(h("text", { key: r.label + "n", x: cx, y: H - padB + 20, fontSize: 12, textAnchor: "middle", fill: "var(--ink-2)" }, r.label));
      if (r.note) marks.push(h("text", { key: r.label + "note", x: cx, y: H - padB + 36, fontSize: 11, textAnchor: "middle", fill: "var(--critical)", fontWeight: 600 }, r.note));
    });
    marks.push(h("line", { key: "base", x1: padL, y1: H - padB, x2: W - padR, y2: H - padB, stroke: "var(--rule-strong)", strokeWidth: 1 }));

    return h("div", { className: "chartbox" },
      h("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", role: "img", "aria-label": props.aria }, marks),
      h(Tip, { tip: t.tip })
    );
  }

  // ─────────────────────────────────────────────────────────────────────────
  // PAGE
  // ─────────────────────────────────────────────────────────────────────────

  function Chip(props) {
    return h("span", { className: "chip " + props.s }, h("span", { "aria-hidden": "true" }, STATUS_GLYPH[props.s]), STATUS_LABEL[props.s]);
  }

  function Row(props) {
    return h("section", { className: "band" },
      h("div", { className: "row" },
        h("aside", { className: "rail" }, props.rail),
