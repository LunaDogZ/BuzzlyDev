<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บันทึกการวัดตัวชี้วัด Buzzly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F5F6F7; --surface:#FFFFFF; --sunk:#ECEEF0;
  --ink:#14171C; --ink-2:#3D444E; --muted:#6B7280; --hair:#DCE0E4;
  --accent:#0B6E75; --accent-soft:#E3F0F0;
  --pass:#1B6E4A; --pass-soft:#E1F0E8;
  --fail:#A32017; --fail-soft:#FBE6E3;
  --wait:#8A6A16; --wait-soft:#F6EDD8;
  --shadow:0 1px 2px rgba(20,23,28,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0F1215; --surface:#171B20; --sunk:#12161A;
    --ink:#E8EBEE; --ink-2:#B9C0C8; --muted:#8A929C; --hair:#2A3138;
    --accent:#4FC3C9; --accent-soft:#12312F;
    --pass:#63C79A; --pass-soft:#12291F;
    --fail:#F08379; --fail-soft:#2C1613;
    --wait:#D9B45C; --wait-soft:#2A2213;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --ground:#0F1215; --surface:#171B20; --sunk:#12161A;
  --ink:#E8EBEE; --ink-2:#B9C0C8; --muted:#8A929C; --hair:#2A3138;
  --accent:#4FC3C9; --accent-soft:#12312F;
  --pass:#63C79A; --pass-soft:#12291F;
  --fail:#F08379; --fail-soft:#2C1613;
  --wait:#D9B45C; --wait-soft:#2A2213;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans Thai","IBM Plex Sans",system-ui,-apple-system,sans-serif;
  font-size:15px; line-height:1.62; font-weight:400;
}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}

/* ── masthead ─────────────────────────────────────────── */
.masthead{border-bottom:1px solid var(--hair);background:var(--surface)}
.masthead .wrap{padding-top:44px;padding-bottom:34px}
.eyebrow{
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin:0 0 14px;
}
h1{
  font-size:clamp(28px,4.2vw,42px);line-height:1.15;font-weight:600;margin:0 0 10px;
  letter-spacing:-.015em;text-wrap:balance;
}
.standfirst{font-size:17px;color:var(--ink-2);max-width:62ch;margin:0 0 26px;font-weight:300}
.pin{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:2px;
  background:var(--hair);border:1px solid var(--hair);border-radius:3px;overflow:hidden;
}
.pin>div{background:var(--surface);padding:11px 14px}
.pin dt{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 3px;font-family:"IBM Plex Mono",monospace}
.pin dd{margin:0;font-size:13px;font-family:"IBM Plex Mono",monospace;word-break:break-all}

/* ── scoreboard ───────────────────────────────────────── */
.board{padding:30px 0 6px}
.board-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px}
.tile{
  background:var(--surface);border:1px solid var(--hair);border-radius:3px;
  padding:13px 14px 14px;display:flex;flex-direction:column;gap:7px;
  text-decoration:none;color:inherit;box-shadow:var(--shadow);
  border-top:3px solid var(--tint);
}
.tile:hover{border-color:var(--accent)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile-id{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.tile-name{font-size:13.5px;font-weight:500;line-height:1.35}
.tile-fig{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;color:var(--tint);font-variant-numeric:tabular-nums;margin-top:auto}
.tile-sub{font-size:11.5px;color:var(--muted);line-height:1.35}

/* ── legend ───────────────────────────────────────────── */
.legend{
  margin:26px 0 0;padding:16px 18px;background:var(--sunk);
  border:1px solid var(--hair);border-radius:3px;
}
.legend h2{font-size:13px;font-weight:600;margin:0 0 8px;letter-spacing:.01em}
.legend p{margin:0 0 12px;font-size:13.5px;color:var(--ink-2);max-width:78ch}
.legend-rows{display:grid;gap:8px}
.legend-row{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;font-size:13px}

/* ── chips ────────────────────────────────────────────── */
.chip{
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
  font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:500;
  letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:2px;
  border:1px solid transparent;
}
.chip.pass{background:var(--pass-soft);color:var(--pass);border-color:var(--pass)}
.chip.fail{background:var(--fail-soft);color:var(--fail);border-color:var(--fail)}
.chip.wait{background:var(--wait-soft);color:var(--wait);border-color:var(--wait)}
.chip.part{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chip.cls{background:transparent;color:var(--muted);border-color:var(--hair);text-transform:none;letter-spacing:0}

/* ── records ──────────────────────────────────────────── */
.records{padding:34px 0 60px;display:grid;gap:18px}
.rec{
  background:var(--surface);border:1px solid var(--hair);border-radius:3px;
  box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:16px;
}
.rec-head{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px;
  padding:16px 20px;border-bottom:1px solid var(--hair);
  border-left:4px solid var(--tint);
}
.rec-id{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--tint);letter-spacing:.06em}
.rec-title{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em}
.rec-group{font-size:12px;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.rec-head .spacer{flex:1}
.rec-body{padding:18px 20px 20px;display:grid;gap:16px}
.claim{font-size:15px;color:var(--ink-2);max-width:80ch;margin:0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 16px;font-size:13.5px;align-items:baseline}
.kv dt{color:var(--muted);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-family:"IBM Plex Mono",monospace}
.kv dd{margin:0}
.scroller{overflow-x:auto;border:1px solid var(--hair);border-radius:2px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:460px}
th,td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--hair)}
th{
  background:var(--sunk);font-weight:500;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);font-family:"IBM Plex Mono",monospace;white-space:nowrap;
}
tbody tr:last-child td{border-bottom:none}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
td.bad{color:var(--fail);font-weight:600}
td.good{color:var(--pass);font-weight:600}
.note{
  font-size:13.5px;color:var(--ink-2);border-left:2px solid var(--tint);
  padding:2px 0 2px 14px;margin:0;max-width:82ch;
}
.note strong{font-weight:600;color:var(--ink)}
.path{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);word-break:break-all}

/* ── footer ───────────────────────────────────────────── */
footer{border-top:1px solid var(--hair);background:var(--surface);padding:28px 0 46px}
footer h2{font-size:14px;font-weight:600;margin:0 0 10px}
footer p{font-size:13.5px;color:var(--ink-2);max-width:80ch;margin:0 0 12px}
pre{
  background:var(--sunk);border:1px solid var(--hair);border-radius:2px;
  padding:12px 14px;overflow-x:auto;font-family:"IBM Plex Mono",monospace;
  font-size:12px;line-height:1.55;margin:0 0 12px;
}
@media (max-width:640px){ .kv{grid-template-columns:1fr;gap:2px 0} .kv dd{margin-bottom:8px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  body{background:#fff;font-size:11.5px}
  .masthead,.rec,footer{box-shadow:none}
  .rec{break-inside:avoid;page-break-inside:avoid}
  .tile{break-inside:avoid}
  .wrap{max-width:none;padding:0 12mm}
}
</style>
</head>

function Chip({tone, children}){
  return html`<span class="chip ${tone}">${children}</span>`;
}

function Tile({k}){
  return html`<a class="tile" href=${'#'+k.id} style=${{'--tint':T[k.tone]}}>
    <span class="tile-id">${k.id}</span>
    <span class="tile-name">${k.name}</span>
    <span class="tile-fig">${k.fig}</span>
    <span class="tile-sub">${k.sub}</span>
  </a>`;
}

function Record({k}){
  const bad = new Set(k.table.bad||[]);
  const good = new Set(k.table.good||[]);
  return html`<section class="rec" id=${k.id} style=${{'--tint':T[k.tone]}}>
    <div class="rec-head">
      <span class="rec-id">${k.id}</span>
      <h2 class="rec-title">${k.name}</h2>
      <span class="rec-group">${k.group}</span>
      <span class="spacer"></span>
      <${Chip} tone=${k.tone}>${k.verdict}<//>
    </div>
    <div class="rec-body">
      <p class="claim">${k.claim}</p>
      <dl class="kv">
        <dt>ที่มาของเกณฑ์</dt>
        <dd><${Chip} tone="cls">${k.cls}<//> <span style=${{color:'var(--ink-2)'}}>${k.clsNote}</span></dd>
        <dt>เครื่องมือ</dt><dd>${k.instrument}</dd>
        <dt>หลักฐาน</dt><dd class="path">${k.evidence}</dd>
      </dl>
      <div class="scroller"><table>
        <thead><tr>${k.table.cols.map((c,i)=>html`<th key=${i} style=${i?{textAlign:'right'}:null}>${c}</th>`)}</tr></thead>
        <tbody>${k.table.rows.map((r,ri)=>html`<tr key=${ri}>${r.map((cell,ci)=>
          ci===0
            ? html`<td key=${ci}>${cell}</td>`
            : html`<td key=${ci} class=${'n'+(ci===1&&bad.has(ri)?' bad':'')+(ci===1&&good.has(ri)?' good':'')}>${cell}</td>`
        )}</tr>`)}</tbody>
      </table></div>
      ${k.notes.map((n,i)=>html`<p class="note" key=${i} dangerouslySetInnerHTML=${{__html:n}}></p>`)}
    </div>
  </section>`;
}
