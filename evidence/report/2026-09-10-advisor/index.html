<title>ผลวัดเจ็ดตัวชี้วัด Buzzly</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
  /* ── tokens ─────────────────────────────────────────────────────────────
     Light palette complete on bare :root; dark redefines only tokens, under
     both the OS media query and the explicit theme stamp. Series colours are
     the validated categorical slots 1 (blue) and 2 (orange); status colours
     are the reserved status palette and are never used as a series. */
  :root {
    color-scheme: light;
    --ground:        #f7f7f5;
    --surface:       #fcfcfb;
    --surface-sunk:  #f1f1ee;
    --rule:          #e0e0da;
    --rule-strong:   #c8c8c0;
    --ink:           #14140f;
    --ink-2:         #52514e;
    --ink-3:         #7b7a74;
    --accent:        #1c5cab;
    --series-before: #2a78d6;
    --series-after:  #eb6834;
    --good:          #0ca30c;
    --warning:       #fab219;
    --critical:      #d03b3b;
    --good-wash:     #eaf6ea;
    --critical-wash: #fbeaea;
    --warning-wash:  #fdf3e0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground:        #141413;
      --surface:       #1a1a19;
      --surface-sunk:  #212120;
      --rule:          #33332f;
      --rule-strong:   #4a4a45;
      --ink:           #f6f6f1;
      --ink-2:         #c3c2b7;
      --ink-3:         #918f86;
      --accent:        #86b6ef;
      --series-before: #3987e5;
      --series-after:  #d95926;
      --good-wash:     #16251656;
      --critical-wash: #2a151556;
      --warning-wash:  #2a221056;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground:        #141413;
    --surface:       #1a1a19;
    --surface-sunk:  #212120;
    --rule:          #33332f;
    --rule-strong:   #4a4a45;
    --ink:           #f6f6f1;
    --ink-2:         #c3c2b7;
    --ink-3:         #918f86;
    --accent:        #86b6ef;
    --series-before: #3987e5;
    --series-after:  #d95926;
    --good-wash:     #16251656;
    --critical-wash: #2a151556;
    --warning-wash:  #2a221056;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }

  /* ── page frame: a document column with a citation rail ─────────────── */
  .page { max-width: 1140px; margin: 0 auto; padding: 0 24px 96px; }
  .band { border-bottom: 1px solid var(--rule); }
  .row { display: grid; grid-template-columns: 178px minmax(0, 1fr); gap: 40px; padding: 46px 0; }
  .rail {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11.5px; line-height: 1.65; color: var(--ink-3);
    border-left: 2px solid var(--rule-strong); padding-left: 14px; word-break: break-word;
    position: sticky; top: 18px; align-self: start;
  }
  .rail b { display: block; color: var(--ink-2); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; font-size: 10.5px; margin: 0 0 5px; }
  .rail p { margin: 0 0 10px; }
  @media (max-width: 860px) {
    .row { grid-template-columns: 1fr; gap: 18px; padding: 34px 0; }
    .rail { position: static; border-left: none; border-top: 2px solid var(--rule-strong); padding-left: 0; padding-top: 10px; order: 2; }
    .col { order: 1; }
  }

  h1 { font-size: clamp(30px, 5vw, 44px); line-height: 1.18; margin: 0 0 14px; font-weight: 700; letter-spacing: -.015em; text-wrap: balance; }
  h2 { font-size: 25px; margin: 0 0 10px; font-weight: 700; letter-spacing: -.012em; text-wrap: balance; line-height: 1.35; }
  h3 { font-size: 17px; margin: 30px 0 8px; font-weight: 600; }
  p  { margin: 0 0 15px; max-width: 66ch; }
  .lede { font-size: 18px; color: var(--ink-2); max-width: 64ch; }
  .eyebrow { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); margin: 0 0 10px; }
  ul { margin: 0 0 15px; padding-left: 20px; max-width: 66ch; }
  li { margin-bottom: 8px; }
  code { font-family: "IBM Plex Mono", monospace; font-size: .88em; background: var(--surface-sunk); padding: 1px 5px; border-radius: 3px; }
  b, strong { font-weight: 600; color: var(--ink); }

  /* ── status chip: colour never alone — glyph + word ─────────────────── */
  .chip { display: inline-flex; align-items: center; gap: 6px; font-family: "IBM Plex Mono", monospace; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; padding: 3px 9px; border-radius: 3px; white-space: nowrap; }
  .chip.pass    { background: var(--good-wash);     color: var(--good);     border: 1px solid var(--good); }
  .chip.fail    { background: var(--critical-wash); color: var(--critical); border: 1px solid var(--critical); }
  .chip.pending { background: var(--warning-wash);  color: var(--ink-2);    border: 1px solid var(--warning); }

  /* ── scoreboard ─────────────────────────────────────────────────────── */
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(212px, 1fr)); gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
  .cell { background: var(--surface); padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 7px; }
  .cell .id { font-family: "IBM Plex Mono", monospace; font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .06em; }
  .cell .what { font-size: 14px; color: var(--ink-2); line-height: 1.5; }
  .cell .fig { font-family: "IBM Plex Mono", monospace; font-size: 25px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .cell .bar { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-3); }

  /* ── the anatomy block: what / with what / from where / why / bar ───── */
  .anat { border: 1px solid var(--rule); background: var(--surface); margin: 18px 0 26px; }
  .anat dl { display: grid; grid-template-columns: 150px minmax(0, 1fr); margin: 0; }
  .anat dt {
    font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink-3); padding: 12px 14px; border-bottom: 1px solid var(--rule); background: var(--surface-sunk);
  }
  .anat dd { margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--rule); font-size: 14.5px; line-height: 1.6; }
  .anat dl > :nth-last-child(1), .anat dl > :nth-last-child(2) { border-bottom: none; }
  @media (max-width: 640px) {
    .anat dl { grid-template-columns: 1fr; }
    .anat dt { border-bottom: none; padding-bottom: 2px; background: transparent; }
  }

  /* ── the five steps: a real sequence, so it is numbered ─────────────── */
  .step { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 18px; margin: 30px 0; }
  .stepnum {
    font-family: "IBM Plex Mono", monospace; font-size: 15px; font-weight: 600;
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    border: 2px solid var(--rule-strong); color: var(--ink-2); background: var(--surface);
  }
  .step.is-key .stepnum { border-color: var(--accent); color: var(--accent); }
  .step h4 { margin: 4px 0 8px; font-size: 16.5px; font-weight: 600; }
  .step h4 span { font-family: "IBM Plex Mono", monospace; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); display: block; font-weight: 500; margin-bottom: 1px; }

  /* ── tables ─────────────────────────────────────────────────────────── */
  .tablewrap { overflow-x: auto; margin: 18px 0 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 9px 14px 9px 0; border-bottom: 1px solid var(--rule); vertical-align: top; line-height: 1.55; }
  th { font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
  td.num, th.num { text-align: right; font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; padding-right: 18px; white-space: nowrap; }

  /* ── figure ─────────────────────────────────────────────────────────── */
  figure { margin: 28px 0 10px; }
  figcaption { font-size: 13.5px; color: var(--ink-3); margin-top: 11px; max-width: 70ch; line-height: 1.65; }
  .figtitle { font-size: 15.5px; font-weight: 600; margin-bottom: 2px; }
  .figsub { font-size: 13px; color: var(--ink-3); margin-bottom: 12px; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 12px; font-size: 12.5px; color: var(--ink-2); align-items: center; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 11px; height: 11px; border-radius: 2px; display: inline-block; }
  .chartbox { position: relative; background: var(--surface); border: 1px solid var(--rule); padding: 14px 12px 6px; overflow-x: auto; }
  svg text { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .tip {
    position: absolute; pointer-events: none; z-index: 5;
    background: var(--ink); color: var(--ground);
    font-family: "IBM Plex Mono", monospace; font-size: 11.5px; line-height: 1.5;
    padding: 6px 9px; border-radius: 4px; white-space: nowrap; transform: translate(-50%, -120%);
  }

  .note { border-left: 3px solid var(--rule-strong); padding: 2px 0 2px 16px; margin: 22px 0; color: var(--ink-2); font-size: 15px; }
  .note.warn { border-left-color: var(--warning); }
  .note.key  { border-left-color: var(--accent); }
  .verdict {
    border: 1px solid var(--rule-strong); background: var(--surface-sunk);
    padding: 16px 18px; margin: 24px 0; font-size: 15.5px; line-height: 1.7;
  }
  .verdict .lab { font-family: "IBM Plex Mono", monospace; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); display: block; margin-bottom: 6px; }
  .foot { padding: 36px 0 0; color: var(--ink-3); font-size: 13px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
(function () {
  "use strict";
  var h = React.createElement;
  var useState = React.useState;

  // ═══════════════════════════════════════════════════════════════════════
  // DATA — every figure is transcribed from a file in the repository. The
  // citation rail beside each section names the file it came from. Nothing
  // on this page is estimated, and nothing is rounded in a flattering
  // direction; where a run went the wrong way it is drawn going the wrong way.
  // ═══════════════════════════════════════════════════════════════════════

  var KPIS = [
    { id: "KPI-1", group: "A", what: "ข้อมูลที่เก็บตรงกับ Meta Ads Manager", fig: "0.0000%", bar: "เกณฑ์ MAPE ≤ 0.5%", status: "pass" },
    { id: "KPI-2", group: "A", what: "ไฟล์ถูกต้องที่นำเข้าได้ครบตามที่ประกาศไว้", fig: "20/20", bar: "เกณฑ์ 100%", status: "pass" },
    { id: "KPI-3", group: "A", what: "ไฟล์เสียที่เข้า dead-letter ถูกรหัส ไม่มีข้อมูลรั่ว", fig: "12/12", bar: "เกณฑ์ 100% ทั้ง 3 แกน", status: "pass" },
    { id: "KPI-4", group: "B", what: "คะแนน Lighthouse Performance (desktop)", fig: "68 / 70", bar: "เกณฑ์ ≥ 80 — สองเส้นทางไม่ถึง", status: "fail" },
    { id: "KPI-5", group: "B", what: "เวลาตอบสนองที่ผู้ใช้ 50 คนพร้อมกัน", fig: "60.00 s", bar: "เกณฑ์ p(95) < 2 s", status: "fail" },
    { id: "KPI-6", group: "C", what: "System Usability Scale หลังทำงานจริง", fig: "—", bar: "เกณฑ์ ≥ 68 · เก็บ 11 ก.ย.", status: "pending" },
    { id: "KPI-7", group: "D", what: "OWASP Top 10 + สแกนอัตโนมัติ", fig: "4/4", bar: "0 High/Critical · 10/10 หมวด", status: "pass" }
  ];
  var STATUS_LABEL = { pass: "ผ่าน", fail: "ไม่ผ่าน", pending: "ยังไม่วัด" };
  var STATUS_GLYPH = { pass: "✓", fail: "✕", pending: "◷" };

  var LH = [
    { route: "R1 · หน้าแรก /", before: 100, after: 100 },
    { route: "R2 · แดชบอร์ด", before: 65, after: 68 },
    { route: "R3 · นำเข้าไฟล์", before: 74, after: 70 }
  ];

  // Lighthouse composes the score from five metrics with fixed weights. These
  // are the median run's own numbers — this is what "68" is made of.
  var LH_POINTS = [
    { metric: "Total Blocking Time", weight: 30, earned: 30 },
    { metric: "Cumulative Layout Shift", weight: 25, earned: 25 },
    { metric: "First Contentful Paint", weight: 10, earned: 10 },
    { metric: "Speed Index", weight: 10, earned: 3.4 },
    { metric: "Largest Contentful Paint", weight: 25, earned: 0 }
  ];

  var REQS = [
    { label: "/dashboard · คำขอทั้งหมด", before: 147, after: 80 },
    { label: "/dashboard · เรียก Supabase", before: 126, after: 60 },
    { label: "/dashboard · เรียก /auth/v1/", before: 30, after: 3 },
    { label: "/imports · คำขอทั้งหมด", before: 109, after: 61 },
    { label: "/imports · เรียก Supabase", before: 95, after: 48 },
    { label: "/imports · เรียก /auth/v1/", before: 26, after: 3 }
  ];

  // k6, p(95) per journey step, median of the three runs in each round.
  var K5_STEPS = [
    { label: "1 · โหลดหน้าเว็บจาก CDN", before: 0.12, after: 0.51 },
    { label: "2 · ล็อกอิน", before: 37.72, after: 39.86 },
    { label: "3 · เปิด session", before: 60, after: 60 },
    { label: "4 · ดึงบัญชีโฆษณา", before: 60, after: 60 },
    { label: "5 · ดึง insights ช่วงกว้าง", before: 60, after: 60 },
    { label: "6 · นับรายแหล่งข้อมูล", before: 60, after: 60 },
    { label: "7 · ดึง insights ช่วงใหม่", before: 60, after: 60 }
  ];

  var K5_MEDIAN_LAT = [
    { label: "รอบ 1", before: 21.63, after: 1.73 },
    { label: "รอบ 2", before: 35.00, after: 0.68 },
    { label: "รอบ 3", before: 6.14, after: 48.79, note: "สวนทาง" }
  ];

  // Failure counts summed over the three runs of each round.
  var K5_DOORS = [
    { label: "500 · เซิร์ฟเวอร์พัง", before: 867, after: 135 },
    { label: "หมดเวลา ไม่ตอบเลย", before: 860, after: 926 },
    { label: "429 · โดนจำกัดอัตรา", before: 183, after: 1047 },
    { label: "504 · gateway timeout", before: 70, after: 105 }
  ];

  var TODAY_COUNTS = [
    { label: "ทอดที่ต้องรอกันบนเส้นทางวิกฤต", before: 3, after: 1, unit: "ทอด" },
    { label: "คำขอ /auth/v1/user ต่อการเปิดหน้า", before: 3, after: 0, unit: "คำขอ" },
    { label: "คำขอ Supabase ทั้งหมดของ /campaigns", before: 51, after: 41, unit: "คำขอ" }
  ];

  var TODAY_PAIRS = [
    { label: "คู่ที่ 1", before: 11459, after: 5418 },
    { label: "คู่ที่ 2", before: 8938, after: 5476 },
    { label: "คู่ที่ 3", before: 10969, after: 13460, note: "สวนทาง" }
  ];

  // ═══════════════════════════════════════════════════════════════════════
  // CHART PRIMITIVES — inline SVG. One scale per chart, hover on every mark,
  // legend whenever two series are drawn, threshold rules on the data's scale.
  // ═══════════════════════════════════════════════════════════════════════

  function useTip() {
    var s = useState(null);
    return {
      tip: s[0],
      show: function (e, text) {
        var box = e.currentTarget.ownerSVGElement.parentNode.getBoundingClientRect();
        var r = e.currentTarget.getBoundingClientRect();
        s[1]({ text: text, x: r.left - box.left + r.width / 2, y: r.top - box.top });
      },
      hide: function () { s[1](null); }
    };
  }
  function Tip(props) {
    if (!props.tip) return null;
    return h("div", { className: "tip", style: { left: props.tip.x + "px", top: props.tip.y + "px" } }, props.tip.text);
  }
  function Legend(props) {
    return h("div", { className: "legend" },
      h("span", null, h("i", { className: "swatch", style: { background: "var(--series-before)" } }), props.before),
      h("span", null, h("i", { className: "swatch", style: { background: "var(--series-after)" } }), props.after),
      props.extra || null
    );
  }

  /* Two series of horizontal bars per row, with an optional threshold rule
     drawn on the same scale. Values sit in a fixed column at the right edge so
     they can never land on top of the rule. */
  function GroupedBars(props) {
    var t = useTip();
    var rows = props.rows, max = props.max;
    var W = 680, padL = props.padL || 168, padR = 66, padT = 18, rowH = 62;
    var H = padT + rows.length * rowH + 32;
    var x = function (v) { return padL + (v / max) * (W - padL - padR); };
    var marks = [];
    rows.forEach(function (r, i) {
      var yTop = padT + i * rowH;
      [[props.beforeName, r.before, "var(--series-before)", 8], [props.afterName, r.after, "var(--series-after)", 30]].forEach(function (p) {
        marks.push(h("rect", {
          key: r.route + p[0], x: padL, y: yTop + p[3], width: Math.max(x(p[1]) - padL, 1.5), height: 16, rx: 4, ry: 4,
          fill: p[2], stroke: "var(--surface)", strokeWidth: 2,
          onMouseEnter: function (e) { t.show(e, p[0] + " · " + p[1] + (props.unit || "")); }, onMouseLeave: t.hide
        }));
        marks.push(h("text", { key: r.route + p[0] + "v", x: W - padR + 12, y: yTop + p[3] + 12.5, fontSize: 12.5, fontWeight: 600, fill: "var(--ink-2)" }, p[1]));
      });
      marks.push(h("text", { key: r.route + "n", x: padL - 12, y: yTop + 30, fontSize: 12, textAnchor: "end", fill: "var(--ink-2)" }, r.route));
    });
    return h("div", { className: "chartbox" },
      h("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", role: "img", "aria-label": props.aria },
        props.threshold ? h("g", null,
          h("line", { x1: x(props.threshold), y1: padT - 4, x2: x(props.threshold), y2: H - 32, stroke: "var(--critical)", strokeWidth: 2, strokeDasharray: "5 4" }),
          h("text", { x: x(props.threshold), y: H - 14, fontSize: 11.5, textAnchor: "middle", fill: "var(--critical)", fontWeight: 600 }, props.thresholdLabel)
        ) : null,
        h("line", { x1: padL, y1: padT - 4, x2: padL, y2: H - 32, stroke: "var(--rule-strong)", strokeWidth: 1 }),
        marks
      ),
      h(Tip, { tip: t.tip })
    );
  }

  /* Points claimed against points available — a shortfall chart. The track is
     the weight, the fill is what was earned. */
  function ShortfallBars(props) {
    var t = useTip();
    var rows = props.rows;
    var max = 30, W = 680, padL = 210, padR = 96, padT = 16, rowH = 40;
    var H = padT + rows.length * rowH + 16;
    var x = function (v) { return (v / max) * (W - padL - padR); };
    var marks = [];
    rows.forEach(function (r, i) {
      var y = padT + i * rowH;
      var full = r.earned >= r.weight - 0.01;
      marks.push(h("rect", {
        key: r.metric + "t", x: padL, y: y + 6, width: x(r.weight), height: 18, rx: 4, ry: 4,
        fill: "var(--surface-sunk)", stroke: "var(--rule)", strokeWidth: 1
      }));
      marks.push(h("rect", {
        key: r.metric + "e", x: padL, y: y + 6, width: Math.max(x(r.earned), r.earned > 0 ? 2 : 0), height: 18, rx: 4, ry: 4,
        fill: full ? "var(--good)" : "var(--critical)", stroke: "var(--surface)", strokeWidth: 2,
        onMouseEnter: function (e) { t.show(e, r.metric + " · ได้ " + r.earned + " จาก " + r.weight + " คะแนน"); }, onMouseLeave: t.hide
      }));
      marks.push(h("text", { key: r.metric + "n", x: padL - 12, y: y + 19.5, fontSize: 12, textAnchor: "end", fill: "var(--ink-2)" }, r.metric));
      marks.push(h("text", {
        key: r.metric + "v", x: padL + x(r.weight) + 12, y: y + 19.5, fontSize: 12.5, fontWeight: 600,
        fill: full ? "var(--good)" : "var(--critical)"
      }, r.earned + " / " + r.weight));
    });
    return h("div", { className: "chartbox" },
      h("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", role: "img", "aria-label": props.aria }, marks),
      h(Tip, { tip: t.tip })
    );
  }

  /* Before dot → after dot on one shared scale. Reads as change, not as two
     separate quantities. */
  function Dumbbell(props) {
